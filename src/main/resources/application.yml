server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/reports;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

    # Для production (PostgreSQL):
    # datasource:
    #   url: jdbc:postgresql://localhost:5432/reports
    #   username: report_user
    #   password: secret
    # jpa:
    #   hibernate:
    #     ddl-auto: validate
    #   properties:
    #     hibernate:
    #       dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://your-auth-server.com/realms/your-realm
  application:
    name: report-design-service

logging:
  level:
    com.report_design: DEBUG