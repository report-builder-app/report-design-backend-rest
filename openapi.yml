openapi: 3.0.3
info:
  title: Report Design Service API
  description: |
    REST API для генерации отчётов из JSON-описания в форматы PDF, XLSX, HTML и JSON,
    а также для управления шаблонами отчётов и проверки источников данных.
    Все эндпоинты, кроме явно указанных как публичные, требуют JWT-токен в заголовке `Authorization: Bearer <token>`.
  version: 0.1.2

servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки
  - url: http://192.168.0.155:8080
    description: Сервер в локальной сети (для фронтенда)

tags:
  - name: Render
    description: Генерация отчётов в выбранном формате
  - name: Templates
    description: Управление сохранёнными шаблонами отчётов
  - name: Metadata
    description: Справочники форматов и стилей
  - name: Validation
    description: Проверка описания отчёта без рендеринга
  - name: DataSources
    description: Проверка подключения к источникам данных

paths:
  # ------------------------------------------------------------------
  # Render
  # ------------------------------------------------------------------
  /api/v1/reports/render/{format}:
    post:
      tags: [Render]
      summary: Сгенерировать отчёт в указанном формате
      description: |
        Принимает JSON-описание отчёта и возвращает бинарный файл в выбранном формате.
        Поддерживаемые форматы: `pdf`, `xls`, `html`, `json` (см. `GET /api/v1/reports/formats`).
      operationId: renderReport
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: path
          required: true
          description: Формат вывода
          schema:
            type: string
            enum: [pdf, xls, html, json]
            example: pdf
        - name: disposition
          in: query
          required: false
          description: |
            `attachment` (по умолчанию) — браузер скачивает файл.
            `inline` — отображает содержимое в iframe (для preview).
          schema:
            type: string
            enum: [attachment, inline]
            default: attachment
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            UUID, позволяющий кэшировать результат рендеринга.
            Повторный вызов с тем же ключом вернёт уже сгенерированный файл.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: Успешный рендеринг отчёта
          headers:
            Content-Disposition:
              description: Имя файла и режим отображения
              schema:
                type: string
                example: attachment; filename="CustomerReport.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reports/formats:
    get:
      tags: [Metadata]
      summary: Список доступных форматов
      description: Возвращает список идентификаторов форматов, зарегистрированных в `RendererRegistry`.
      operationId: listFormats
      security: []   # публичный эндпоинт
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["pdf", "xls", "html", "json"]

  # ------------------------------------------------------------------
  # Templates
  # ------------------------------------------------------------------
  /api/v1/reports:
    get:
      tags: [Templates]
      summary: Список сохранённых шаблонов
      operationId: listTemplates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список шаблонов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportListItemDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Templates]
      summary: Сохранить новый шаблон
      operationId: createTemplate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveReportRequest'
      responses:
        '201':
          description: Шаблон сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReportDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/reports/{id}:
    get:
      tags: [Templates]
      summary: Загрузить шаблон по id
      operationId: getTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Шаблон найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReportDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Templates]
      summary: Обновить существующий шаблон
      operationId: updateTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveReportRequest'
      responses:
        '200':
          description: Шаблон обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedReportDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Templates]
      summary: Удалить шаблон
      operationId: deleteTemplate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '204':
          description: Шаблон удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------------
  # Styles
  # ------------------------------------------------------------------
  /api/v1/reports/styles:
    get:
      tags: [Metadata]
      summary: Справочник стилей
      description: Возвращает список преднастроенных стилей, на которые можно ссылаться через `element.style`.
      operationId: listStyles
      security: []   # публичный эндпоинт
      responses:
        '200':
          description: Список стилей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StyleDto'

  # ------------------------------------------------------------------
  # Validation
  # ------------------------------------------------------------------
  /api/v1/reports/validate:
    post:
      tags: [Validation]
      summary: Проверить описание отчёта без рендеринга
      operationId: validateReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: Результат валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------------
  # DataSources
  # ------------------------------------------------------------------
  /api/v1/datasources/test:
    post:
      tags: [DataSources]
      summary: Проверить подключение к источнику данных
      description: |
        Выполняет пробное подключение и (для `custom`-провайдеров) читает первые строки.
        **Требует роль `ADMIN`.** В production должен быть ограничен whitelist'ом хостов.
      operationId: testDataSource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceTestRequest'
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT-токен, выпущенный настроенным OAuth2/OpenID провайдером

  parameters:
    ReportId:
      name: id
      in: path
      required: true
      description: Идентификатор сохранённого шаблона
      schema:
        type: string
        example: "8b1c9f2e-4c5d-4a7b-9e0f-1234567890ab"

  responses:
    BadRequest:
      description: Ошибка валидации или некорректный запрос
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Отсутствует или недействителен JWT-токен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Внутренняя ошибка (например, недоступность источника данных)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    # ---------------- Render ----------------
    RenderRequest:
      type: object
      required: [report]
      properties:
        report:
          $ref: '#/components/schemas/ReportDefinitionDto'
        parameters:
          type: object
          additionalProperties: true
          description: Runtime-параметры отчёта (переопределяют значения по умолчанию)
          example:
            StartDate: "2024-01-01"
            EndDate: "2024-12-31"

    ReportDefinitionDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: CustomerReport
        title:
          type: string
          example: Customer List
        pageFormat:
          type: string
          enum: [A4, A5, LETTER]
          example: A4
        orientation:
          type: string
          enum: [PORTRAIT, LANDSCAPE]
          example: PORTRAIT
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterDto'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDto'
        queryString:
          type: string
          description: SQL-запрос для источника данных `sql`
          example: "SELECT id, name FROM customers WHERE created_at >= $P{StartDate}"
        bands:
          type: array
          items:
            $ref: '#/components/schemas/BandDto'
        dataSource:
          $ref: '#/components/schemas/DataSourceDto'

    ParameterDto:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          example: StartDate
        type:
          type: string
          enum: [String, Long, Integer, Date, BigDecimal]
          example: Date
        defaultValue:
          nullable: true

    FieldDto:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          example: id
        type:
          type: string
          enum: [String, Long, Integer, Date, BigDecimal]
          example: Long

    BandDto:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [TITLE, COLUMN_HEADER, DETAIL, SUMMARY]
          example: DETAIL
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ElementDto'

    ElementDto:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [label, textField, line]
          example: textField
        text:
          type: string
          description: Текст для `label`
          example: Hello
        expression:
          type: string
          description: Выражение для `textField` (`$F{field}`, `$P{param}`)
          example: "$F{name}"
        style:
          type: string
          description: Имя стиля из `GET /api/v1/reports/styles`
          example: header
        width:
          type: number
          format: float
          example: 100.0
        height:
          type: number
          format: float
          example: 20.0
        y:
          type: number
          format: float
          description: Вертикальная позиция для `line`
          example: 0.0

    DataSourceDto:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [sql, web, custom]
          example: sql
        jdbcUrl:
          type: string
          description: Только для `provider=sql`
          example: "jdbc:postgresql://localhost:5432/mydb"
        user:
          type: string
          description: Только для `provider=sql`
        password:
          type: string
          description: Только для `provider=sql`
        url:
          type: string
          description: Только для `provider=web`
          example: "https://api.example.com/orders"
        jsonPath:
          type: string
          description: Только для `provider=web`
          example: "$.data[*]"
        options:
          type: object
          additionalProperties: true
          description: Только для `provider=custom` (например, MongoDB)
          example:
            providerName: mongodb
            uri: "mongodb://localhost:27017"
            database: shop
            collection: orders

    # ---------------- Templates ----------------
    SaveReportRequest:
      type: object
      required: [definition]
      properties:
        definition:
          $ref: '#/components/schemas/ReportDefinitionDto'

    SavedReportDto:
      type: object
      properties:
        id:
          type: string
          example: "8b1c9f2e-4c5d-4a7b-9e0f-1234567890ab"
        definition:
          $ref: '#/components/schemas/ReportDefinitionDto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReportListItemDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        title:
          type: string
        updatedAt:
          type: string
          format: date-time

    # ---------------- Styles ----------------
    StyleDto:
      type: object
      properties:
        name:
          type: string
          example: header
        fontName:
          type: string
          example: Helvetica
        fontSize:
          type: integer
          example: 12
        bold:
          type: boolean
          example: true
        italic:
          type: boolean
          example: false
        foreground:
          type: string
          example: "#000000"
        background:
          type: string
          nullable: true
          example: "#EEEEEE"

    # ---------------- Validation ----------------
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    # ---------------- DataSources ----------------
    DataSourceTestRequest:
      type: object
      required: [dataSource]
      properties:
        dataSource:
          $ref: '#/components/schemas/DataSourceDto'

    DataSourceTestResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        elapsedMs:
          type: integer
          format: int64
        sampleRows:
          type: integer
          nullable: true

    # ---------------- Errors ----------------
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Unsupported format: unknown"
        instance:
          type: string
          format: uri
          example: "/api/v1/reports/render/unknown"

security:
  - bearerAuth: []